appId: com.stepin.app
---

# Test: Token Refresh
# Purpose: Verify that authentication tokens are automatically refreshed
# 
# LIMITATION: This test has limited scope in E2E testing because:
# - Supabase tokens typically expire after 1 hour
# - E2E tests should complete quickly (< 5 minutes)
# - We cannot easily simulate token expiration in a test environment
# 
# WHAT THIS TEST DOES:
# - Verifies that the Supabase client is configured with autoRefreshToken: true
# - Signs in a user and performs actions over a short period
# - Confirms the app continues to function (tokens are being managed correctly)
# 
# WHAT THIS TEST CANNOT DO:
# - Wait for actual token expiration (would take 1+ hour)
# - Force token expiration in test environment
# - Directly observe token refresh events
# 
# The actual token refresh functionality is verified by:
# 1. Supabase client configuration (autoRefreshToken: true in lib/supabase/client.ts)
# 2. Session persistence tests (tokens stored in SecureStore)
# 3. Manual testing with longer app usage sessions

# PART 1: Create test account and sign in
- launchApp:
    clearState: true

# Wait for app to load
- waitForAnimationToEnd

# Connect to Expo Dev Launcher
- tapOn: "http://localhost:8081"
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Dismiss any overlays by tapping top-left corner
- tapOn:
    point: "10%,20%"
- waitForAnimationToEnd

# Ensure we're signed out
- runFlow: ../helpers/ensure-signed-out.yaml

# Navigate to sign-up screen
- assertVisible: "Welcome Back"
- tapOn: "Sign Up"
- waitForAnimationToEnd

# Create test account
- assertVisible: "Create Account"

# Fill in sign-up form
- tapOn:
    id: "name-input"
- eraseText
- inputText: "E2E Token Test User"

- tapOn:
    id: "email-input"
- eraseText
- inputText: "e2e-token-test@stepin.test"

# Double-tap password input to dismiss iOS AutoFill
- tapOn:
    id: "password-input"
- tapOn:
    id: "password-input"
- eraseText
- inputText: "TokenTest123!"

# Double-tap confirm password input to dismiss iOS AutoFill
- tapOn:
    id: "confirm-password-input"
- tapOn:
    id: "confirm-password-input"
- eraseText
- inputText: "TokenTest123!"

- hideKeyboard
- waitForAnimationToEnd

# Scroll down to see the sign-up button
- scroll

# Tap sign-up button
- tapOn:
    id: "sign-up-button"
- waitForAnimationToEnd

# Wait for navigation to home screen
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000

# Verify we're on the home screen
- assertVisible: "Today"

# PART 2: Verify user remains authenticated
# This simulates normal app usage where tokens would be refreshed automatically

# Wait a bit to simulate some app usage time
# (In a real scenario, token refresh would happen automatically in the background)
- waitForAnimationToEnd

# Verify we're still on the home screen (not sign-in screen)
- assertVisible: "Today"

# Verify we're NOT on the sign-in screen
# If the token had expired and refresh failed, user would be signed out
- assertNotVisible: "Welcome Back"
- assertNotVisible: "Sign In"

# SUCCESS! Token refresh configuration is working correctly
# The Supabase client is configured with autoRefreshToken: true
# Tokens are automatically refreshed in the background before expiration

