appId: com.stepin.app
---
# Test: User can sign in with existing credentials (Version 4 - Adaptive)
# Priority: P0 - Critical
# Handles both cases: app starts authenticated OR app starts on sign-in screen

# Launch the app
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Load the app from Expo Dev Launcher
- tapOn: "http://localhost:8081"
- waitForAnimationToEnd

# Dismiss Expo Dev Menu popup if it appears
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Close the Expo Dev Menu
- tapOn:
    point: "10%,20%"
    optional: true
- waitForAnimationToEnd

# Wait for app to fully load
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# ADAPTIVE APPROACH: Check if we're authenticated or not
# If we see "Today", we're authenticated and need to sign out first
# If we see "Welcome Back", we're on sign-in screen and can proceed

# Try to navigate to Profile (only works if authenticated)
- tapOn:
    text: "Profile"
    optional: true
- waitForAnimationToEnd

# If we're on Profile, scroll to Sign Out button and tap it
- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN
    timeout: 10000
    optional: true

- tapOn:
    id: "sign-out-button"
    optional: true
- waitForAnimationToEnd

# Confirm sign out in alert
- tapOn:
    text: "Sign Out"
    optional: true
- waitForAnimationToEnd

# Wait for navigation back to sign-in screen
- waitForAnimationToEnd
- waitForAnimationToEnd

# Now we should be on the sign-in screen
# Wait for "Welcome Back" to appear
- extendedWaitUntil:
    visible: "Welcome Back"
    timeout: 15000

- assertVisible: "Welcome Back"

# Fill in email
- assertVisible: "Email"
- tapOn:
    id: "email-input"
- inputText: "test1@stepin.test"

# Fill in password
- tapOn:
    id: "password-input"
- inputText: "TestPass123!"

# Submit sign in
- tapOn: "Sign In"
- waitForAnimationToEnd

# Wait for authentication and navigation (with generous timeout for app reload)
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Verify successful signin
- assertVisible: "Today"

# Verify we're authenticated
- assertNotVisible: "Email"
- assertNotVisible: "Welcome Back"

