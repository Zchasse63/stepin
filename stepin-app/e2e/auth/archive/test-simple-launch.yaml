appId: com.stepin.app
---
# Simple test: Just launch the app and see what screen we're on

# Launch the app
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Load the app from Expo Dev Launcher
- tapOn: "http://localhost:8081"
- waitForAnimationToEnd

# Dismiss Expo Dev Menu popup if it appears
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Close the Expo Dev Menu
- tapOn:
    point: "10%,20%"
    optional: true
- waitForAnimationToEnd

# Wait for app to load
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Check if we're on the sign-in screen
- assertVisible: "Welcome Back"

