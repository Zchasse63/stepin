appId: com.stepin.app
---
# Test: User can open Add Buddy modal
# Priority: P1 - High
# Feature: Social Features - Add Buddy
# Estimated time: 0.5 days

# Launch the app
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Load the app from Expo Dev Launcher
- tapOn: "http://localhost:8081"
- waitForAnimationToEnd

# Dismiss Expo Dev Menu popup
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Close the Expo Dev Menu
- tapOn:
    point: "10%,20%"
    optional: true
- waitForAnimationToEnd

# Ensure we're signed out
- runFlow: ../helpers/ensure-signed-out.yaml

# Sign up for a new account
- assertVisible: "Welcome Back"
- tapOn: "Sign Up"
- waitForAnimationToEnd

# Fill in sign-up form
- tapOn:
    id: "name-input"
- inputText: "E2E Add Buddy"

- tapOn:
    id: "email-input"
- inputText: "e2e-add-buddy@stepin.test"

- tapOn:
    id: "password-input"
- inputText: "TestPass123!"

- tapOn:
    id: "confirm-password-input"
- inputText: "TestPass123!"

# Hide keyboard and scroll to ensure button is visible
- hideKeyboard
- waitForAnimationToEnd
- scroll

# Submit sign-up
- tapOn:
    id: "sign-up-button"
- waitForAnimationToEnd

# Wait for navigation to home screen (longer timeout for E2E reliability)
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Navigate to Buddies tab
- tapOn:
    text: "Buddies"
    optional: true
- waitForAnimationToEnd

# Switch to Buddies tab (not Activity)
- tapOn:
    text: "Buddies"
    optional: true
- waitForAnimationToEnd

# Look for Add Buddy button (+ icon or "Add Buddy" text)
- tapOn:
    id: "add-buddy-button"
    optional: true
- waitForAnimationToEnd

# Verify Add Buddy modal opened
- assertVisible:
    text: "Add Buddy"
    optional: true

# Verify email input is present
- assertVisible:
    text: "Enter your buddy's email address"
    optional: true

# Close modal
- tapOn:
    id: "close"
    optional: true
- waitForAnimationToEnd

# SUCCESS! Add Buddy modal is accessible

