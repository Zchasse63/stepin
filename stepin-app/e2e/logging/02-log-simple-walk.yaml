appId: com.stepin.app
---
# Test: User can log a simple walk with just steps
# Priority: P0 - Critical
# Feature: Walk Tracking - Manual Walk Logging
# Estimated time: 0.5 days

# Launch the app
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Load the app from Expo Dev Launcher
- tapOn: "http://localhost:8081"
- waitForAnimationToEnd

# Dismiss Expo Dev Menu popup if it appears
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Close the Expo Dev Menu
- tapOn:
    point: "10%,20%"
    optional: true
- waitForAnimationToEnd

# Ensure we're signed out
- runFlow: ../helpers/ensure-signed-out.yaml

# Sign up for a new account
- assertVisible: "Welcome Back"
- tapOn: "Sign Up"
- waitForAnimationToEnd

# Fill in sign-up form
- tapOn:
    id: "name-input"
- inputText: "E2E Simple Walk"

- tapOn:
    id: "email-input"
- inputText: "e2e-simple-walk@stepin.test"

- tapOn:
    id: "password-input"
- inputText: "TestPass123!"

- tapOn:
    id: "confirm-password-input"
- inputText: "TestPass123!"

# Hide keyboard and scroll to ensure button is visible
- hideKeyboard
- waitForAnimationToEnd
- scroll

# Submit sign-up
- tapOn:
    id: "sign-up-button"
- waitForAnimationToEnd

# Wait for navigation to home screen (longer timeout for E2E reliability)
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Wait for the screen to fully load
- waitForAnimationToEnd

# Scroll down multiple times to ensure we reach the Log Walk button
- scroll
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd

# Open Log Walk modal
- tapOn: "Log a Walk"
- waitForAnimationToEnd

# Verify modal opened
- assertVisible: "Log a Walk"

# Enter steps only (simple walk)
- tapOn:
    text: "e.g., 5000"
- inputText: "5000"

# Submit the walk
- tapOn: "Save Walk"
- waitForAnimationToEnd

# Wait for success message
- extendedWaitUntil:
    visible: "Success"
    timeout: 10000

# Verify success alert
- assertVisible: "Walk logged successfully!"

# Dismiss success alert
- tapOn: "OK"
- waitForAnimationToEnd

# Verify modal closed and we're back on Today screen
- assertVisible: "Today"

# Verify step count updated (should show 5000 steps)
- assertVisible:
    text: "5,000"
    optional: true

# SUCCESS! Simple walk logged successfully

