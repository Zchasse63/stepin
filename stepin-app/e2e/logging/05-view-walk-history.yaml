appId: com.stepin.app
---
# Test: User can view walk history after logging a walk
# Priority: P1 - High
# Feature: Walk Tracking - Walk History
# Estimated time: 0.5 days

# Launch the app
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Load the app from Expo Dev Launcher
- tapOn: "http://localhost:8081"
- waitForAnimationToEnd

# Dismiss Expo Dev Menu popup
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Close the Expo Dev Menu
- tapOn:
    point: "10%,20%"
    optional: true
- waitForAnimationToEnd

# Ensure we're signed out
- runFlow: ../helpers/ensure-signed-out.yaml

# Sign up for a new account
- assertVisible: "Welcome Back"
- tapOn: "Sign Up"
- waitForAnimationToEnd

# Fill in sign-up form
- tapOn:
    id: "name-input"
- inputText: "E2E Walk History"

- tapOn:
    id: "email-input"
- inputText: "e2e-walk-history@stepin.test"

- tapOn:
    id: "password-input"
- inputText: "TestPass123!"

- tapOn:
    id: "confirm-password-input"
- inputText: "TestPass123!"

# Hide keyboard and scroll to ensure button is visible
- hideKeyboard
- waitForAnimationToEnd
- scroll

# Submit sign-up
- tapOn:
    id: "sign-up-button"
- waitForAnimationToEnd

# Wait for navigation to home screen (longer timeout for E2E reliability)
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000

# Wait for the screen to fully load
- waitForAnimationToEnd

# Scroll down multiple times to ensure we reach the Log Walk button
- scroll
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd
- scroll
- waitForAnimationToEnd

# Log a walk first
- tapOn: "Log a Walk"
- waitForAnimationToEnd

- tapOn:
    text: "e.g., 5000"
- inputText: "6000"

- tapOn: "Save Walk"
- waitForAnimationToEnd

# Wait for success and dismiss
- extendedWaitUntil:
    visible: "Success"
    timeout: 10000
- tapOn: "OK"
- waitForAnimationToEnd

# Navigate to History tab
- tapOn: "History"
- waitForAnimationToEnd

# Verify we're on History screen
- assertVisible: "History"

# Verify walk appears in history (Recent Walks section)
- assertVisible:
    text: "Recent Walks"
    optional: true

# Verify walk data is visible (6000 steps)
- assertVisible:
    text: "6,000"
    optional: true

# SUCCESS! Walk history displays logged walks

