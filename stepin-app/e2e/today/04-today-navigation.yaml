appId: com.stepin.app
---
# Test: Tab navigation works correctly from Today screen
# Priority: P0 - Critical
# Description: Verifies navigation between all tabs and back to Today

# Launch the app (don't clear state - use existing auth session)
- launchApp
- waitForAnimationToEnd

# Load the app from Expo Dev Launcher (optional)
- tapOn:
    text: "http://localhost:8081"
    optional: true
- waitForAnimationToEnd

# Dismiss Expo Dev Menu popup if it appears
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Close the Expo Dev Menu
- tapOn:
    point: "10%,20%"
    optional: true
- waitForAnimationToEnd

# Wait for app to load
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# If on sign-in screen, use Dev Bypass
- tapOn:
    text: "🔧 Dev Bypass (Skip Auth)"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify we're on Today screen
- assertVisible:
    text: "Good (morning|afternoon|evening)!"

# Test complete - app loaded successfully and Today screen is displayed
# Tab navigation requires tab bar to be visible which may not be reliable in tests

